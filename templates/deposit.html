   <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Deposit Money</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='deposit.css') }}">
</head>

<body>

    <h2>Deposit Money</h2>

    <form method="POST">

        <input
            type="number"
            name="amount"
            placeholder="Enter amount"
            required
        >

        <button type="submit">Deposit</button>

    </form>

    {% if message %}
        <p>{{ message }}</p>
    {% endif %}

    <a href="{{ url_for('login') }}">Back</a>

</body>

</html>
</body>
</html>
